<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Meu Kanban de Tarefas</h1>

    <form id="form-tarefa">
      <input
        type="text"
        id="input-tarefa"
        placeholder="Digite uma nova tarefa..."
        autocomplete="off"
      />
      <button type="submit">Adicionar</button>
    </form>

    <div class="quadro">
      <section class="coluna" data-coluna="afazer">
        <h2>A Fazer</h2>
        <ul class="lista-tarefas" data-coluna="afazer"></ul>
      </section>

      <section class="coluna" data-coluna="fazendo">
        <h2>Fazendo</h2>
        <ul class="lista-tarefas" data-coluna="fazendo"></ul>
      </section>

      <section class="coluna" data-coluna="concluido">
        <h2>Concluído</h2>
        <ul class="lista-tarefas" data-coluna="concluido"></ul>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
